    "ipykernel>=7.2.0",
    "matplotlib",
    "pronouncing",
    "setuptools",
    "datasets",
    "pandas",
    "plotly>=6.5.2",
    "nbformat>=5.10.4",
    "torchvision>=0.25.0",
    "nnsight>=0.6.3",
    "sae-lens>=6.42.0",
    "peft>=0.19.1",
    "mlflow>=3.14.0",
    "deepspeed>=0.19.2",
    "kernels>=0.12,<0.13",
