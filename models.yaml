# Model registry for the reproducibility package (trimmed to the models the paper uses).
# Keys are the `--model` values accepted by every runner; `hf_name` is the Hugging Face repo.
# `layer_path` is the attribute path to the decoder layers, `use_bos` whether the tokenizer
# prepends BOS, `model_class` which Auto class loads the checkpoint.
#
# Gated repositories (google/gemma-4-*, google/gemma-3-*, google/gemma-2-*): accept the licence on
# Hugging Face and export HF_TOKEN before downloading. Models whose recipe needs a newer
# `transformers` (gemma-4-12b-it, mistral-small-3.2-24b, rwkv7-g1j-13.3b, qwen3.5-397b-a17b) are
# run through `uv run --with "transformers==5.15.1" ...` (see README.md, "Per-model overlays").

# ---- the main cast (Fig. 3, 4, 5, 6, 7, 8, 9, 10, 18; Tables 1, 4-6) ----------------------
gemma-4-31B-it:
  hf_name: google/gemma-4-31B-it
  family: gemma4
  layer_path: model.language_model.layers
  use_bos: true
  model_class: image_text_to_text
gemma-4-26b-a4b:
  hf_name: google/gemma-4-26b-a4b-it
  family: gemma4
  layer_path: model.language_model.layers
  use_bos: true
  model_class: image_text_to_text
qwen3.6-27b:
  hf_name: Qwen/Qwen3.6-27B
  family: qwen35
  layer_path: model.language_model.layers
  use_bos: false
  model_class: image_text_to_text
pythia-6.9b-tulu:
  hf_name: allenai/open-instruct-pythia-6.9b-tulu
  family: pythia
  layer_path: gpt_neox.layers
  use_bos: false
# attention-free replication model (custom modeling code; `uv run --with "transformers==5.15.1"`)
rwkv7-g1j-13.3b:
  hf_name: RWKV/RWKV7-G1j-13.3B-20260831
  family: rwkv7
  layer_path: rwkv7.blocks
  use_bos: false
  trust_remote_code: true
  attn: eager            # no attention layers; transformers rejects sdpa for this class

# ---- the counter-example model of Appendix A.14 (Fig. 20); transformers==5.15.1 overlay ------
